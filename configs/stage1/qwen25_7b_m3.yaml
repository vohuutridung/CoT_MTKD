schema_version: 1
seed: 42
model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  use_cache: false
lora:
  rank: 16
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
stage1:
  objective: sft_dpp_rbf_local_gac
  num_experts: 3
  forward_mode: one_pass
  epochs: 3
  learning_rate: 5.0e-5
  micro_batch_size: 1
  global_batch_size: 16
  gradient_accumulation_steps: null
  dpp_weight: 0.1
  gac_beta: 0.5
  gac_bandwidth_scale: 0.5
  rbf_weight: 0.5
  rbf_bandwidth_scale: 1.0
  sft_warmup_fraction: 0.10
  max_grad_norm: 1.0
  checkpoint_every_steps: 10
  log_every_steps: 1
  resume_from: null
kneedle:
  search_k: 512
  k_min: 8
dpp:
  jitter: 1.0e-4
  max_jitter: 1.0e-2
rbf:
  bandwidth_ema: 0.9
  bandwidth_floor: 1.0e-12
optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
scheduler:
  name: cosine
  warmup_ratio: 0.10
  min_lr_ratio: 0.0
runtime:
  lm_head_chunk_tokens: 32768
  dataloader_workers: 0
  pin_memory: true
  probe_hidden_device: cuda
  deterministic_algorithms: false
paths:
  prepared: artifacts/prepared/s1k_1_1_cot_only
  output: artifacts/stage1/main
