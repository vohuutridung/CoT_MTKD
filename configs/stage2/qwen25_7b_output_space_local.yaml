schema_version: 2
teacher_source:
  type: local
method: disagreement_adaptive_distribution_aggregation_mtkd
seed: 42
model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  use_cache: false
lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
aggregation:
  temperature: 1.0
  disagreement_pooling_power: 4.0
  tau_quantile: 0.75
  sft_weight: 0.01
  search_k: 512
  k_min: 8
  teacher_execution: precomputed_support_tail
logging:
  reasoning_steps: true
  performance: true
stage2:
  epochs: 1
  learning_rate: 2.0e-5
  micro_batch_size: 1
  global_batch_size: 16
  incomplete_batch_policy: drop
  gradient_accumulation_steps: null
  max_length: 32768
  max_grad_norm: 1.0
  checkpoint_every_steps: 10
  log_every_steps: 1
  resume_from: null
optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
scheduler:
  name: cosine
  warmup_ratio: 0.10
  min_lr_ratio: 0.0
runtime:
  lm_head_chunk_tokens: 4096
  preprocessing_hidden_storage: cpu
  dataloader_workers: 0
paths:
  prepared: artifacts/prepared/s1k_1_1_cot_only
  stage1: artifacts/stage1/main
  teacher_cache_dir: artifacts/teacher_cache/output_space_local
  output: artifacts/stage2/output_space_local
